name: Build and Deploy

# web_scrape had no workflows at all: whatever ran on the box was put there by
# hand, so #12's scraper and #13's Dockerfile fix had no way to ship. This
# mirrors chat-microservice's deploy, which is the proven pattern on this host.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      inspect:
        description: 'Read-only: report what is running on the box (containers, where web_scrape lives, which URL the orchestrator uses) and deploy nothing. Values are never printed, only key names.'
        required: false
        default: "false"
      set_sentry_dsn:
        description: 'Set the Sentry DSN on the EC2 box instead of deploying. Blank = normal build + deploy. A DSN is a write-only ingest URL and is safe here; never paste any other credential into this field.'
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/peptides-ai-ecosystem/web_scrape

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    # A DSN-only dispatch changes one line in an env file; it must not rebuild
    # and roll a new image as a side effect.
    if: github.event_name != 'workflow_dispatch' || (inputs.set_sentry_dsn == '' && inputs.inspect != 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.set_sentry_dsn == '' && inputs.inspect != 'true')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy the deployment compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          # Not a secret, just the Linux login. Defaults to the Ubuntu AMI's
          # `ubuntu` — which is what peptides-platform hardcodes in all seven
          # of its SSH steps — so this repo needs only EC2_HOST and
          # EC2_SSH_KEY to work. Set EC2_USER to override on a different AMI.
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.deploy.yml
          target: ~/web_scrape/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        # `envs:` below only forwards variables into the remote shell; it does
        # not create them. Without this block the script runs with GITHUB_TOKEN
        # unbound, which is how the first deploy failed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_SHA
          command_timeout: 15m
          script: |
            set -euo pipefail

            # Name the host before doing anything. There is more than one EC2
            # box in this account and only one of them runs Docker; landing on
            # the wrong one should say so, not fail with "command not found".
            echo "==> host: $(hostname) as $(whoami)"
            command -v docker >/dev/null 2>&1 || {
              echo "ERROR: docker is not on PATH for $(whoami)@$(hostname)."
              echo "       Either EC2_HOST points at a box that does not run Docker,"
              echo "       or this user is not in the docker group."
              exit 1
            }

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd ~/web_scrape/

            # env_file is required by the compose file, so the container cannot
            # start without it. Creating a blank one here would turn a missing
            # configuration into a service that boots and misbehaves.
            test -f .env || {
              echo "ERROR: ~/web_scrape/.env is missing. Create it before the first deploy."
              exit 1
            }

            # The shared network is created once per host, by whichever service
            # comes up first. Creating it here is idempotent and means
            # web_scrape can be the first thing deployed on a fresh box.
            docker network inspect ai-microservices-net >/dev/null 2>&1 \
              || docker network create ai-microservices-net

            export WEB_SCRAPE_IMAGE="ghcr.io/peptides-ai-ecosystem/web_scrape:${GITHUB_SHA}"
            echo "==> deploying $WEB_SCRAPE_IMAGE"

            for i in 1 2 3; do
              docker compose -f docker-compose.deploy.yml pull web-scrape && break
              echo "Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done

            docker compose -f docker-compose.deploy.yml up -d --no-deps --no-build web-scrape

            # Poll rather than sleep-and-hope: Chromium and the APScheduler jobs
            # make startup slower than a single check allows, but a genuinely
            # broken boot must still fail the deploy.
            for i in $(seq 1 20); do
              if curl -fsS -m 5 http://127.0.0.1:8005/health >/dev/null 2>&1; then
                echo "==> healthy on attempt $i"
                curl -s -m 5 http://127.0.0.1:8005/health | head -c 300; echo
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: /health did not answer after the deploy"
            docker compose -f docker-compose.deploy.yml ps web-scrape
            docker compose -f docker-compose.deploy.yml logs --tail 60 web-scrape
            exit 1

  set-sentry-dsn:
    name: Set the Sentry DSN on EC2
    runs-on: ubuntu-latest
    # Independent of build/deploy: rewrites one key in the env file the
    # container already reads, then recreates it to pick the value up.
    if: github.event_name == 'workflow_dispatch' && inputs.set_sentry_dsn != ''

    steps:
      - name: Write SENTRY_DSN into ~/web_scrape/.env and recreate the container
        uses: appleboy/ssh-action@v1
        env:
          DSN: ${{ inputs.set_sentry_dsn }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DSN
          command_timeout: 5m
          script: |
            set -euo pipefail
            F="$HOME/web_scrape/.env"

            # Refuse anything that is not a Sentry DSN. This field is the one
            # place a person could paste the wrong credential, and writing it
            # into a live env file would be worse than doing nothing.
            case "$DSN" in
              https://*@*.ingest.*sentry.io/*) : ;;
              *) echo "ERROR: that does not look like a Sentry DSN - nothing written"; exit 1 ;;
            esac

            test -f "$F" || { echo "ERROR: $F does not exist - refusing to create one"; exit 1; }

            cp -p "$F" "$F.bak-$(date +%Y%m%d%H%M%S)"
            BEFORE=$(wc -l < "$F")

            # One key, in place, idempotent. The value is never echoed.
            if grep -q '^SENTRY_DSN=' "$F"; then
              tmp=$(mktemp)
              grep -v '^SENTRY_DSN=' "$F" > "$tmp"
              echo "SENTRY_DSN=$DSN" >> "$tmp"
              cat "$tmp" > "$F"
              rm -f "$tmp"
              echo "==> replaced the existing SENTRY_DSN line"
            else
              echo "SENTRY_DSN=$DSN" >> "$F"
              echo "==> appended SENTRY_DSN"
            fi

            echo "==> lines before/after: $BEFORE / $(wc -l < "$F")"
            echo "==> other keys intact: $(grep -c '=' "$F") total"

            cd "$HOME/web_scrape"
            # env_file is read at container creation, not on restart, so a plain
            # restart would keep the old environment.
            docker compose -f docker-compose.deploy.yml up -d --no-deps --no-build --force-recreate web-scrape

            for i in $(seq 1 20); do
              if curl -fsS -m 5 http://127.0.0.1:8005/health >/dev/null 2>&1; then
                echo "==> healthy on attempt $i"; exit 0
              fi
              sleep 5
            done
            echo "ERROR: /health did not answer after the recreate"
            docker compose -f docker-compose.deploy.yml logs --tail 40 web-scrape
            exit 1

  inspect:
    name: Inspect the box (read-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.inspect == 'true'
    steps:
      - name: Report containers and where web_scrape runs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -u
            echo "==> host: $(hostname)"
            echo "== containers =="
            docker ps -a --format '  {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo "== networks =="
            docker network ls --format '  {{.Name}}'
            echo "== anything scrape-shaped =="
            for c in $(docker ps -a --format '{{.Names}}' | grep -iE 'scrap|web.?scrape'); do
              echo "  --- $c ---"
              docker inspect "$c" --format '    image={{.Config.Image}}  workdir={{.Config.WorkingDir}}'
              echo "    compose project dir: $(docker inspect "$c" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
              echo "    env KEYS (values withheld):"
              docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | sed 's/^/      /'
            done
            echo "== the orchestrator's view of web_scrape =="
            for c in $(docker ps --format '{{.Names}}' | grep -iE 'orchestr|gateway'); do
              # a URL, not a credential - safe to show
              docker exec "$c" printenv WEBSCRAPE_SERVICE_URL 2>/dev/null | sed "s/^/  $c WEBSCRAPE_SERVICE_URL=/"
            done
            echo "== networks each container is on (routing depends on sharing one) =="
            for c in $(docker ps --format '{{.Names}}'); do
              echo "  $c: $(docker inspect "$c" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}({{join $v.Aliases ","}}) {{end}}')"
            done
            echo "== gateway settings that decide whether an http upstream is accepted =="
            O=$(docker ps --format '{{.Names}}' | grep -iE 'orchestr' | head -1)
            for k in ENVIRONMENT REQUIRE_UPSTREAM_TLS CHAT_SERVICE_URL PEPTIDE_SERVICE_URL SDS_SERVICE_URL WEBSCRAPE_SERVICE_URL UPSTREAM_AUTH_HEADER; do
              # URLs and flags only - API_TOKEN is deliberately not in this list
              echo "  $k=$(docker exec "$O" printenv "$k" 2>/dev/null || echo '<unset>')"
            done
            echo "  API_TOKEN is $(docker exec "$O" sh -c 'test -n "$API_TOKEN" && echo set || echo EMPTY')"
            echo "== gateway /health =="
            curl -s -m 10 http://127.0.0.1:8080/health | head -c 1500; echo
            echo "== candidate env files on disk (paths only) =="
            ls -la ~/web_scrape ~/web-scrape ~/webscrape 2>/dev/null | sed 's/^/  /' || true
            find ~ -maxdepth 3 -name '.env' -path '*scrap*' 2>/dev/null | sed 's/^/  /'
            echo "== done (nothing was modified) =="

