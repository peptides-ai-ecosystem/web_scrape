[project]
name = "web-scraping"
version = "0.1.0"
description = "Peptide and competitor-price scrapers, platform sync and API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "playwright>=1.49.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.6.0",
    "selenium>=4.40.0",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.0.30",
    "tqdm>=4.67.3",
    "uvicorn>=0.47.0",
    "webdriver-manager>=4.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
