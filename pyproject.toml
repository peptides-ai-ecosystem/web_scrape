[project]
name = "web-scraping"
version = "0.1.0"
description = "Peptide and competitor-price scrapers, platform sync and API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "playwright>=1.49.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.6.0",
    "selenium>=4.40.0",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.0.30",
    "tqdm>=4.67.3",
    "uvicorn>=0.47.0",
    "webdriver-manager>=4.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=9.0.3",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# Ecosystem rule set (orchestrator CODING_STANDARDS.python.md): errors, pyflakes,
# import order, pyupgrade, bugbear, blind except (BLE001) and try/except/pass (S110).
select = ["E", "F", "W", "I", "UP", "B", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# BASELINE (recorded 2026-10-17, ruff 0.17.0): findings that existed before the gate was added.
# Each entry is a ratchet: fix the findings in a file, then delete its line. Never add a line here
# for new code; fix the finding instead. The counts are the findings at the time of recording.
"app/api/openapi_docs.py" = ["E501"]  # E501 x17
"app/api/v1/endpoints/core.py" = ["B904", "BLE001"]  # B904 x6, BLE001 x4
"app/api/v1/endpoints/csv_inspector.py" = ["B904"]  # B904 x3
"app/api/v1/endpoints/evaluation.py" = ["B904"]  # B904 x2
"app/api/v1/endpoints/graph.py" = ["B904", "BLE001"]  # B904 x6, BLE001 x4
"app/api/v1/endpoints/operations.py" = ["B904"]  # B904 x3
"app/api/v1/endpoints/sync.py" = ["B904"]  # B904 x3
"app/api/v1/endpoints/vendors.py" = ["B904"]  # B904 x12
"app/controllers/pep_pedia_sync_controller.py" = ["BLE001", "E501"]  # BLE001 x3, E501 x6
"app/core/job_queue.py" = ["UP042"]  # UP042 x1
