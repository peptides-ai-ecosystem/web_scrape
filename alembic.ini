# Alembic for web_scrape's OWN tables only: vendor_scrape_targets and
# vendor_price_observations (decision R10). The platform's tables (peptides,
# peptide_graph, ...) belong to peptides-platform's Drizzle migrations (XR-8);
# alembic/env.py refuses to autogenerate anything else.
# Version table: alembic_version_web_scrape. The URL comes from DATABASE_URL.
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
