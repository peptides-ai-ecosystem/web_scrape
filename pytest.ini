[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider
markers =
    pep_pedia: pep-pedia scrape, extractors, CSV, graph and core read APIs
    vendors: competitor vendor scraping (discovery, scrape, SSRF, targets API)
    sync: mapper groups, fill-empty-only sync, platform schema contract (XR-8)
    evaluation: CSV versus database evaluation
    ops: scheduler, jobs, health, Sentry, gateway token, image contents
    docker: needs a local Docker daemon (throwaway Postgres container); skipped when Docker is unavailable
